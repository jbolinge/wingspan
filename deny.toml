[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Not a list of individual RUSTSEC ids: `unmaintained = "workspace"` gates
# only the workspace's own direct dependencies for `unmaintained` advisories,
# which is the point of turning it on here. It silently covers three known
# unmaintained-only families arriving through `wingspan-desktop` -> tauri 2 ->
# the Linux webview stack, none of which has a safe upgrade available today:
#   - the ten gtk-rs GTK3 bindings (RUSTSEC-2024-0411..0420) - archived
#     upstream in favour of gtk4-rs, which Tauri does not use yet;
#   - the five rust-unic crates (RUSTSEC-2025-0075/0080/0081/0098/0100),
#     reached via urlpattern <- tauri-utils;
#   - RUSTSEC-2024-0370, proc-macro-error, a build-time-only dependency of
#     the gtk3-rs macros.
# A *vulnerability* anywhere, or a yanked crate, still fails - that is what
# keeps this job meaningful rather than leaving `cargo deny` permanently red
# and therefore unread.
#
# Revisit when Tauri moves to GTK4 (drops the ten gtk3-rs advisories) and when
# tauri-utils drops `urlpattern` (drops the five `unic-*` ones).
unmaintained = "workspace"

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "MPL-2.0",
  "CDLA-Permissive-2.0", "BSL-1.0",
]
private = { ignore = true }

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
