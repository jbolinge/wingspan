# Wingspan configuration. Copy to wingspan.toml (never committed) and edit.
#
# The desktop app reads config from ONLY two places, on Linux:
#   ~/.config/wingspan/wingspan.toml, then WINGSPAN_* env overrides that.
# It never reads ./wingspan.toml, ./.env or $WINGSPAN_CONFIG — an app
# launched from a .desktop entry has a working directory nobody chose.
# wingspan-cli and wingspan-devserver (dev-only) also honour --config,
# $WINGSPAN_CONFIG and ./wingspan.toml. For those two the layers are read
# lowest first, each overriding the last: ~/.config/wingspan/wingspan.toml,
# then ./wingspan.toml, then $WINGSPAN_CONFIG, then --config <path>, then
# WINGSPAN_* env, which wins.
#
# Four keys are picker-written: [yfinance] python, [schwab] token_path,
# [schwab] env_file and [tastytrade] env_file are the ones the desktop app
# itself writes through Settings' native file choosers, each behind its own
# confirmation dialog, and nothing the SPA sends can set them — a JS-writable
# python path would be arbitrary code execution, and a JS-writable token_path
# would aim the read-only token reader at an attacker's file. Editing them
# here by hand is still perfectly fine. [schwab] token_config, [yfinance]
# script and [market] state_dir are the opposite: config-file-only, with no
# picker and no settings-card field at all. See docs/DESKTOP.md.

[trades]
# Folder containing "Open Trades", "Closed Trades", "Daily Trade Statement"
# (discovery descends one level, so the parent works too).
#
# You do not normally need this. The usual way in is the dashboard's Trades
# control: you choose a folder on this computer and Wingspan reads it where it
# is — nothing is ever copied, moved or deleted, and "Clear" only stops
# showing it. That choice is remembered in <state_dir>/trades_root.json and
# outranks this key. Set `root` only to pin a folder for every run of this
# install; leave it unset and the app starts empty, waiting for you to choose
# one. See docs/CONFIG.md.
# root = "~/Trades"
open_dir = "Open Trades"
closed_dir = "Closed Trades"
statements_dir = "Daily Trade Statement"
statement_timezone = "America/Chicago"
# How long the folder must be quiet before a burst of file events becomes one
# reload. A TOS export lands as many writes at once, so this is not a delay to
# shave: 750 ms is the default.
watch_debounce_ms = 750
# Poll the folder every N seconds instead of using the platform notifier.
# 0 (the default) uses the notifier, which is what you want for a local disk.
# Set this only for a network or sync mount — Dropbox, Syncthing, SMB, NFS —
# where a write made elsewhere never reaches inotify at all.
watch_poll_secs = 0

[schwab]
# Path to an EXISTING token file, produced and refreshed by your own login
# tooling and often shared with other applications. Wingspan opens it
# read-only: it never writes, creates, renames, chmods, locks, copies or backs
# up anything in that directory, and a refreshed access token lives only in
# memory. Read access is all the service needs.
# token_path = "/srv/schwab/schwab_token.json"
# Production indirection (see .env.example): an external KEY=VALUE file that
# holds the two secrets, and an external TOML file that points at the token
# JSON. Variables already set in the real environment always win.
# env_file = "/path/to/schwab-secrets.env"
# token_config = "/path/to/schwab-paths.toml"
# token_config_key = "paths.token_file"
app_key_env = "SCHWAB_APP_KEY"
app_secret_env = "SCHWAB_APP_SECRET"
# May wingspan run the refresh grant itself (keeping the result in memory)?
# false leaves every refresh to the applications that own the token file.
refresh = true

[tastytrade]
# A second live source, alongside Schwab. Off by default, and not in the
# [market] ladders below — turn it on here AND name it in spot_sources /
# option_sources, or nothing changes.
#
# Credentials come from an OAuth2 personal grant: my.tastytrade.com →
# Manage → My Profile → API → OAuth Applications → new client (scope `read`
# only), then Create Grant on that client, which mints a refresh token with
# no browser round trip. That refresh token does not rotate and does not
# expire, so there is NO token file here and nothing for wingspan to write:
# it is a static string in an environment variable, and the 15-minute access
# token lives only in memory. See docs/TASTYTRADE.md.
enabled = false
# External KEY=VALUE secrets file holding the variables named below. This may
# be the SAME file [schwab] env_file names — the two providers' variables
# live in one namespace and the first file to supply a name wins. Variables
# already set in the real environment always win over both.
# env_file = "/path/to/tastytrade-secrets.env"
client_secret_env = "TASTYTRADE_CLIENT_SECRET"
refresh_token_env = "TASTYTRADE_REFRESH_TOKEN"
# Optional on the refresh grant; sent only when the variable is set.
client_id_env = "TASTYTRADE_CLIENT_ID"
# api.cert.tastyworks.com. Auth works there, but every /market-data call
# answers 502 and the environment resets every 24 hours, so this cannot
# smoke-test quotes — it degrades the provider on purpose.
sandbox = false
# Is this account entitled to real-time data? There is no marker on the wire,
# and off-hours staleness looks exactly like a delayed feed, so we cannot
# detect this — only you know. Set it true for an unfunded account (or a
# professional one without the real-time opt-in) and quotes are reported as
# delayed rather than live.
delayed = false
# Sent as Accept-Version, so a server-side rename surfaces as a deliberate
# 406 rather than a silently missing field. Empty sends no header.
api_version = "20250904"

[yfinance]
enabled = true
# python = "~/.local/share/wingspan/venv/bin/python"
# The bridge script is embedded in the binary and self-installs into the state
# dir; set `script` only to override it (e.g. while hacking on the bridge).
# script = "bridge/yfinance_bridge.py"

[market]
# The fallback ladders, best first. Legal names: schwab, tastytrade,
# yfinance, cache, fixture — and, for option_sources only, statement (the
# marks off your own statements; a statement carries no index quote).
# tastytrade is deliberately absent from
# the defaults — adding it is one edit here, e.g.
#   spot_sources = ["tastytrade", "schwab", "yfinance", "cache"]
#   option_sources = ["tastytrade", "schwab", "yfinance", "cache", "statement"]
spot_sources = ["schwab", "yfinance", "cache"]
option_sources = ["schwab", "yfinance", "cache", "statement"]
refresh_secs_open = 15
refresh_secs_closed = 300
# Stop fetching while the desktop window is hidden or minimised. Off by
# default: a dashboard behind another window is still a dashboard.
pause_when_hidden = false
# state_dir = "~/.local/share/com.jbolinge.wingspan/state"
# The default shown above — one directory shared by the desktop app and
# wingspan-cli, where snapshots, the chosen-folder record and the yfinance
# bridge script are written.

[pricing]
risk_free_rate = 0.042
dividend_yield = 0.013

[pricing.weighted_vega]
reference = "front_expiry"   # or e.g. "30d"
exponent = 0.5

[risk_graph]
points = 241
range_pct = 0.10
tplus_preset = "quarters"    # T+0, T+1/4, T+1/2, T+3/4, T+(DTE-1)
