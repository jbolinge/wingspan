[workspace]
resolver = "2"
members = [
  "crates/wingspan-core",
  "crates/wingspan-pricing",
  "crates/wingspan-marketdata",
  "crates/wingspan-app",
  "crates/wingspan-cli",
  "crates/wingspan-devserver",
  "web/src-tauri",
]
# The desktop crate needs the GTK/WebKit stack, which a plain checkout (and CI's
# non-desktop jobs) does not have. Keeping it out of the default set means a
# bare `cargo build`/`check`/`test` at the workspace root still works; the
# desktop job asks for it by name with `-p wingspan-desktop`.
default-members = [
  "crates/wingspan-core",
  "crates/wingspan-pricing",
  "crates/wingspan-marketdata",
  "crates/wingspan-app",
  "crates/wingspan-cli",
  "crates/wingspan-devserver",
]

[workspace.package]
version = "0.4.4"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/jbolinge/wingspan"

[workspace.dependencies]
wingspan-core = { path = "crates/wingspan-core" }
wingspan-pricing = { path = "crates/wingspan-pricing" }
wingspan-marketdata = { path = "crates/wingspan-marketdata" }
wingspan-app = { path = "crates/wingspan-app" }

anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
dirs = "6"
figment = { version = "0.10", features = ["toml", "env"] }
futures = "0.3"
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-embed = "8"
rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Pinned to the minor (and the backend feature) tauri-plugin-dialog 2.7.3
# resolves to, so the desktop crate's own `rfd::MessageDialog` — shown for a
# config error, before any app handle exists — and the plugin's file dialogs
# are one rfd, on one GTK3 backend, rather than two linked side by side.
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }

# dev
approx = "0.5"
insta = { version = "1", features = ["yaml"] }
proptest = "1"
tempfile = "3"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# pedantic subset: silence the noisy ones that fight numeric/finance code
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
too_many_lines = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
similar_names = "allow"
unreadable_literal = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
many_single_char_names = "allow"
suboptimal_flops = "allow"

[profile.release]
# No `panic = "abort"`: the command layer relies on unwinding a panic into a `JoinError`.
lto = "fat"
codegen-units = 1
strip = "symbols"
