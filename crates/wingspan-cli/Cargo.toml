[package]
name = "wingspan-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The headless sanity checks: `validate`, `risk`, `doctor`, `dump-contract`.
# No transport and no GUI — a plain `cargo build -p wingspan-cli` works on a
# machine with neither WebKitGTK nor a display.
[[bin]]
name = "wingspan-cli"
path = "src/main.rs"

[dependencies]
wingspan-app = { workspace = true }
wingspan-core = { workspace = true }
wingspan-pricing = { workspace = true }
wingspan-marketdata = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
