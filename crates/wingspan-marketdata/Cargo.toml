[package]
name = "wingspan-marketdata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Exposes `wingspan_marketdata::testing` (provider doubles and a sample
# snapshot) to other crates' tests without shipping them in the library.
testing = []

[dependencies]
wingspan-core = { workspace = true }
wingspan-pricing = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
reqwest = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# This crate's own integration tests use the `testing` doubles, which the
# library itself does not compile in.
wingspan-marketdata = { path = ".", features = ["testing"] }
approx = { workspace = true }
# `test-util` (paused time) is a test-only concern, so it is enabled here
# rather than widening the workspace's tokio features for everyone.
tokio = { workspace = true, features = ["test-util"] }
rust_decimal_macros = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
