[package]
name = "wingspan-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "wingspan_server"
path = "src/lib.rs"

[[bin]]
name = "wingspan"
path = "src/main.rs"

[features]
default = []
embed-ui = ["dep:rust-embed"]

[dependencies]
wingspan-core = { workspace = true }
wingspan-pricing = { workspace = true }
wingspan-marketdata = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
figment = { workspace = true }
futures = { workspace = true }
notify = { workspace = true }
rust-embed = { workspace = true, optional = true, features = ["mime-guess", "interpolate-folder-path"] }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
rust_decimal_macros = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
