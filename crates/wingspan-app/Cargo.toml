[package]
name = "wingspan-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Library only, and deliberately transport-free: the shipped product is the
# Tauri desktop app (`web/src-tauri`), the dev server (`crates/wingspan-devserver`)
# and the CLI (`crates/wingspan-cli`) are the other two front ends, and all
# three wrap exactly these functions. Nothing here links axum, clap or tauri.
[lib]
name = "wingspan_app"
path = "src/lib.rs"

[dependencies]
wingspan-core = { workspace = true }
wingspan-pricing = { workspace = true }
wingspan-marketdata = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
dirs = { workspace = true }
figment = { workspace = true }
futures = { workspace = true }
notify = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = "0.8"
toml_edit = "0.22"
tokio-stream = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rust_decimal_macros = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
